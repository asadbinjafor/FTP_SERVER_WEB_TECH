<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starting A$AD FTP</title>
  <style>
    body { font-family: system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; margin: 0; color: #e5e7eb; background: #111827; }
    main { max-width: 440px; padding: 28px; border: 1px solid #374151; border-radius: 14px; background: #1f2937; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    button { border: 0; border-radius: 8px; padding: 10px 16px; color: white; background: #2563eb; cursor: pointer; }
    p { line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Starting A$AD FTP</h1>
    <p id="status" role="status" aria-live="polite">Connecting to the server…</p>
    <button id="retry" type="button">Retry now</button>
  </main>
  <script>
    const status = document.getElementById('status');
    const homepage = '/view/Home.php';
    let successes = 0;
    let timer;
    let checking = false;
    async function check() {
      if (checking) return;
      checking = true;
      clearTimeout(timer);
      status.textContent = 'Checking server connection…';
      try {
        const responses = await Promise.all([
          fetch('/health.php', { cache: 'no-store' }),
          fetch(homepage, { cache: 'no-store' })
        ]);
        if (responses.every(response => response.status === 200)) {
          successes++;
          if (successes >= 2) {
            status.textContent = 'Connected. Opening the homepage…';
            window.location.replace(homepage);
            return;
          }
          status.textContent = 'Server is responding. Confirming connection…';
        } else {
          successes = 0;
          status.textContent = 'Server is starting or unavailable. Retrying in 5 seconds…';
        }
      } catch (_) {
        successes = 0;
        status.textContent = 'Connection failed. Retrying in 5 seconds…';
      } finally {
        checking = false;
      }
      timer = setTimeout(check, 5000);
    }
    document.getElementById('retry').addEventListener('click', check);
    check();
  </script>
</body>
</html>
